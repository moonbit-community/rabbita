name: publish-module
run-name: publish ${{ inputs.module }}

# Publishes one module of this repository to mooncakes.io as moonbit-community,
# using the org secret MOONCAKES_MOONBIT_COMMUNITY_TOKEN (same as the org
# workflow template). Each module lives in its own directory.

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to publish
        required: true
        type: choice
        options:
          - rui
          - warren
          - rabbita

permissions: {}

concurrency:
  group: publish-module-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODULE_DIR: ${{ inputs.module }}
      TAG_PREFIX: ${{ format('{0}-v', inputs.module) }}
      # Check and publish the module alone; the root moon.work would otherwise
      # pull in sibling workspace members.
      MOON_WORK: "off"
    outputs:
      published_tag: ${{ steps.prepublish.outputs.published_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-ubuntu
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      - name: prepublish check
        id: prepublish
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          moon fmt
          git diff --exit-code
          moon check
          moon test
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)"
          if [[ -z "$version" ]]; then
            echo "could not read package version from moon.mod" >&2
            exit 1
          fi
          echo "published_tag=${TAG_PREFIX}${version}" >> "$GITHUB_OUTPUT"

      - name: publish
        working-directory: ${{ env.MODULE_DIR }}
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBIT_COMMUNITY_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: tag published commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_TAG: ${{ needs.publish.outputs.published_tag }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$PUBLISHED_TAG" \
            -f sha="$GITHUB_SHA"
